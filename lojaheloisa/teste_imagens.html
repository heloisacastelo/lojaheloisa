<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de imagens</title>
<style>body{font-family:Arial,sans-serif;padding:24px} .grade{display:flex;flex-wrap:wrap;gap:24px} figure{width:160px;text-align:center} img{width:120px;height:120px;object-fit:contain} figcaption{margin-top:8px}</style>
</head>
<body>
<h1>Teste de imagens da Loja Castelo</h1>
<p>Estas imagens são carregadas da pasta local imagens.</p>
<div class="grade">
<figure><img src="imagens/logo.png" alt="Logo da loja"><figcaption>logo.png</figcaption></figure>
<figure><img src="imagens/icone-clientes.png" alt="Ícone de clientes"><figcaption>icone-clientes.png</figcaption></figure>
<figure><img src="imagens/icone-produtos.png" alt="Ícone de produtos"><figcaption>icone-produtos.png</figcaption></figure>
<figure><img src="imagens/icone-vendas.png" alt="Ícone de vendas"><figcaption>icone-vendas.png</figcaption></figure>
</div>
</body>
</html>
